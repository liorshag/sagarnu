# Publish only the app files, never PLAN.md or other project files.
[build]
  command = "rm -rf dist && mkdir dist && cp index.html style.css app.js manifest.json tmdb-logo.svg dist/"
  publish = "dist"

# Server-side TMDB proxy (/api/genres, /api/titles). Needs TMDB_ACCESS_TOKEN.
[functions]
  directory = "netlify/functions"
